[package]
name = "crawler-user-agents"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
description = "Detect crawlers and bots by User-Agent using the monperrus/crawler-user-agents list"
license = "MIT OR Apache-2.0"
authors = ["Anish Pallati"]
repository = "https://github.com/ap-1/crawler-user-agents"
keywords = ["crawler", "bot", "user-agent", "spider", "scraper"]
categories = ["web-programming"]
include = ["/src", "/data", "/LICENSE-MIT", "/LICENSE-APACHE-2.0", "/README.md"]

[dependencies]
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
